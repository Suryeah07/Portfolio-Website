<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#skyGrad)"/>
  <g transform="translate(40, 35)">
    <rect width="520" height="310" rx="12" fill="#0f172a" fill-opacity="0.85"/>
    <circle cx="25" cy="20" r="5" fill="#ef4444"/>
    <circle cx="42" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="59" cy="20" r="5" fill="#10b981"/>
    <!-- Search Bar -->
    <rect x="90" y="10" width="340" height="20" rx="10" fill="#1e293b"/>
    <circle cx="105" cy="20" r="4" fill="#64748b"/>
    
    <!-- Weather Widget Main -->
    <g transform="translate(30, 50)">
      <rect width="210" height="235" rx="10" fill="#1e293b"/>
      <circle cx="105" cy="65" r="45" fill="url(#sunGlow)"/>
      <circle cx="105" cy="65" r="28" fill="#facc15"/>
      <path d="M 85 90 C 70 90, 60 75, 75 65 C 75 50, 95 40, 110 50 C 120 40, 140 45, 140 60 C 150 60, 155 75, 145 85 C 145 90, 135 90, 85 90 Z" fill="#ffffff" fill-opacity="0.85"/>
      <text x="105" y="145" fill="#ffffff" font-family="sans-serif" font-size="34" font-weight="bold" text-anchor="middle">72°F</text>
      <text x="105" y="172" fill="#38bdf8" font-family="sans-serif" font-size="14" text-anchor="middle">Partly Cloudy • San Francisco</text>
      <rect x="30" y="195" width="150" height="25" rx="6" fill="#334155"/>
      <text x="105" y="212" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Humidity: 48% | Wind: 9mph</text>
    </g>
    
    <!-- 5-Day Forecast Chart -->
    <g transform="translate(260, 50)">
      <rect width="230" height="235" rx="10" fill="#1e293b"/>
      <text x="20" y="30" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="600">5-Day Forecast</text>
      <!-- Forecast graph line -->
      <polyline points="20,130 65,95 110,110 155,75 200,85" fill="none" stroke="#38bdf8" stroke-width="4"/>
      <!-- Dots -->
      <circle cx="20" cy="130" r="5" fill="#facc15"/>
      <circle cx="65" cy="95" r="5" fill="#facc15"/>
      <circle cx="110" cy="110" r="5" fill="#facc15"/>
      <circle cx="155" cy="75" r="5" fill="#facc15"/>
      <circle cx="200" cy="85" r="5" fill="#facc15"/>
      <!-- Day labels -->
      <text x="20" y="165" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Mon</text>
      <text x="65" y="165" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Tue</text>
      <text x="110" y="165" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Wed</text>
      <text x="155" y="165" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Thu</text>
      <text x="200" y="165" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Fri</text>
      <!-- Stat pills -->
      <rect x="20" y="185" width="190" height="35" rx="6" fill="#334155"/>
      <text x="115" y="207" fill="#cbd5e1" font-family="sans-serif" font-size="12" text-anchor="middle">Live API Data Sync: OK</text>
    </g>
  </g>
</svg>
