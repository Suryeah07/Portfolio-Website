<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <rect width="400" height="400" rx="200" fill="url(#bgGrad)"/>
  <!-- Decorative Ring -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="6"/>
  <!-- Body / Shoulders -->
  <path d="M 100 370 C 100 290, 140 260, 200 260 C 260 260, 300 290, 300 370 Z" fill="#1e293b" filter="url(#shadow)"/>
  <!-- Shirt Collar -->
  <path d="M 170 260 L 200 300 L 230 260 Z" fill="#ffffff"/>
  <path d="M 185 260 L 200 330 L 215 260 Z" fill="#6366f1"/>
  <!-- Head & Neck -->
  <rect x="180" y="210" width="40" height="60" rx="10" fill="#fcd34d"/>
  <ellipse cx="200" cy="180" rx="65" ry="75" fill="#fde68a" filter="url(#shadow)"/>
  <!-- Hair -->
  <path d="M 135 170 C 135 110, 160 90, 200 90 C 240 90, 265 110, 265 170 C 255 140, 240 130, 200 130 C 160 130, 145 140, 135 170 Z" fill="#312e81"/>
  <!-- Glasses -->
  <rect x="155" y="165" width="36" height="26" rx="8" fill="none" stroke="#1e1b4b" stroke-width="4"/>
  <rect x="209" y="165" width="36" height="26" rx="8" fill="none" stroke="#1e1b4b" stroke-width="4"/>
  <line x1="191" y1="178" x2="209" y2="178" stroke="#1e1b4b" stroke-width="4"/>
  <!-- Eyes -->
  <circle cx="173" cy="178" r="4" fill="#1e1b4b"/>
  <circle cx="227" cy="178" r="4" fill="#1e1b4b"/>
  <!-- Smile -->
  <path d="M 185 210 Q 200 225 215 210" fill="none" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
</svg>
